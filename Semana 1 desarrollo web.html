<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  
<div class="container-fluid mt-3">
  
  <div class="row">
    <div class="bg-dark col-12">Navbar</div>
  </div>
  
  <div class="row">
    <div class="bg-success col-4">Izq</div>
    <div class="bg-danger col-4">Centro</div>
    <div class="bg-success col-4">Der</div>
  </div>
  
  <div class="row">
    <div class="bg-danger col-3">Izq</div>
    <div class="bg-warning col-6">Centro</div>
    <div class="bg-danger col-3">Der</div>
  </div>
  
  <div class="row">
    <div class="bg-info col-6">Izq</div>
    <div class="bg-secondary col-6">Der</div>
  </div>

</div>

</body>
</html>
